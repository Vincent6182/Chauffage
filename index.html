<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chaudière</title>
    <!-- Balises Apple Web App Plein Écran -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#090e1a">
    <meta name="apple-mobile-web-app-title" content="Chaudière">
    <style>
        :root {
            --bg-dark: #090e1a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.78);
            --text-muted: rgba(255, 255, 255, 0.42);
            --accent-blue: #3898ff;
            --accent-green: #2eb85c;
            --accent-red: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: #090e1a !important;
            background: #090e1a !important;
            overscroll-behavior-y: none;
        }

        /* Fond uni bleu nuit sous l'encoche et la barre d'état iOS */
        body::before {
            content: "";
            position: fixed;
            top: -120px;
            left: 0;
            right: 0;
            bottom: -120px;
            background-color: #090e1a;
            z-index: -1;
            pointer-events: none;
        }

        body {
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* Marge haute sécurisée pour l'heure, l'encoche/Dynamic Island et la batterie iOS */
            padding-top: max(calc(env(safe-area-inset-top, 0px) + 14px), 52px);
            padding-bottom: max(calc(env(safe-area-inset-bottom, 0px) + 20px), 30px);
            padding-left: 14px;
            padding-right: 14px;
            overflow-y: auto;
        }

        .app-grid {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        /* Base des cartes avec effet verre et bordure lumineuse */
        .card {
            border-radius: 20px;
            padding: 14px 15px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 176px;
        }

        .card-full {
            grid-column: 1 / -1;
            min-height: auto;
            padding: 16px 18px;
        }

        /* Halos colorés par type de pavé */
        .card-matin {
            background:
                radial-gradient(circle at 82% 85%, rgba(46, 204, 113, 0.25) 0%, transparent 55%),
                radial-gradient(circle at 15% 20%, rgba(65, 130, 210, 0.28) 0%, transparent 60%),
                linear-gradient(145deg, rgba(38, 56, 86, 0.78) 0%, rgba(22, 33, 52, 0.88) 100%);
        }

        .card-aprem {
            background:
                radial-gradient(circle at 82% 55%, rgba(245, 135, 35, 0.48) 0%, rgba(205, 85, 20, 0.22) 48%, transparent 75%),
                linear-gradient(145deg, rgba(52, 54, 72, 0.78) 0%, rgba(30, 32, 46, 0.88) 100%);
        }

        .card-manuelle {
            background:
                radial-gradient(circle at 55% 95%, rgba(20, 175, 165, 0.28) 0%, transparent 62%),
                radial-gradient(circle at 15% 30%, rgba(56, 152, 255, 0.2) 0%, transparent 55%),
                linear-gradient(145deg, rgba(32, 52, 76, 0.8) 0%, rgba(20, 32, 48, 0.9) 100%);
        }

        /* En-tête de chaque pavé */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-title-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .card-day {
            font-size: 11px;
            font-weight: 600;
            text-transform: capitalize;
            color: rgba(142, 202, 230, 0.92);
            padding-left: 25px;
        }

        .card-full .card-day {
            display: none;
        }

        .icon-matin-box {
            width: 18px;
            height: 18px;
            border-radius: 5px;
            background: linear-gradient(180deg, #ff7e36 0%, #ffb347 60%, #3a7bd5 60%, #2b5876 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .card-temp {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* Chiffre de réglage centré */
        .card-setting-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px 0 10px 0;
        }

        .card-setting {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: -1.2px;
            color: var(--text-primary);
            text-align: center;
            line-height: 1;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .card-full .card-setting {
            font-size: 54px;
            letter-spacing: -1.5px;
        }

        /* Pied de carte */
        .card-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            min-height: 24px;
        }

        .water-temp {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        .card-full .water-temp {
            font-size: 15px;
        }

        /* Badge Plage Optimale */
        .badge {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(180deg, #34c759 0%, #249f43 100%);
            color: #ffffff;
            padding: 3px 9px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            box-shadow: 0 3px 10px rgba(46, 184, 92, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .badge.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        /* État Chauffage Coupé */
        .card.cutoff .card-setting {
            color: #ff6961;
            font-size: 30px;
            letter-spacing: -0.4px;
        }

        .card-full.cutoff .card-setting {
            font-size: 40px;
        }

        /* Curseur cranté de 1 en 1 */
        .manual-control {
            margin: 14px 0 6px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-wrapper {
            position: relative;
            height: 34px;
            display: flex;
            align-items: center;
        }

        .custom-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #3898ff 0%, #3898ff 24%, rgba(255, 255, 255, 0.16) 24%, rgba(255, 255, 255, 0.16) 100%);
            outline: none;
            position: relative;
            z-index: 2;
            cursor: pointer;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .custom-slider::-webkit-slider-thumb:active {
            transform: scale(1.12);
        }

        .custom-slider::-moz-range-thumb {
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        .slider-ticks {
            position: absolute;
            top: 50%;
            left: 11px;
            right: 11px;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            z-index: 1;
            pointer-events: none;
        }

        .tick {
            width: 1.5px;
            height: 14px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 1px;
        }

        .tick.major {
            height: 18px;
            width: 2px;
            background: rgba(255, 255, 255, 0.35);
        }

        .tick.active-tick {
            background: rgba(56, 152, 255, 0.75);
        }

        .ticks-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            padding: 0 2px;
        }

        /* Chargement et erreur */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(12, 18, 32, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .error-message {
            grid-column: 1 / -1;
            color: var(--accent-red);
            font-size: 13px;
            text-align: center;
            padding: 8px;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
