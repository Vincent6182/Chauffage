<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chaudière</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#090e1a">
    <meta name="apple-mobile-web-app-title" content="Chaudière">
    <style>
        :root {
            --bg-dark: #090e1a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.78);
            --text-muted: rgba(255, 255, 255, 0.42);
            --accent-blue: #3898ff;
            --accent-green: #2eb85c;
            --accent-red: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: #090e1a;
            background: #090e1a;
            min-height: 100%;
        }

        body {
            color: var(--text-primary);
            min-height: 100vh;
            display: block;
            padding-top: max(calc(env(safe-area-inset-top, 0px) + 16px), 54px);
            padding-bottom: max(calc(env(safe-area-inset-bottom, 0px) + 20px), 30px);
            padding-left: 14px;
            padding-right: 14px;
            overflow-y: auto;
        }

        .app-grid {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            border-radius: 20px;
            padding: 13px 13px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
            min-height: 162px;
        }

        .card-full {
            grid-column: 1 / -1;
            min-height: auto;
            padding: 16px 18px;
        }

        .card-matin {
            background:
                radial-gradient(circle at 82% 85%, rgba(46, 204, 113, 0.25) 0%, transparent 55%),
                radial-gradient(circle at 15% 20%, rgba(65, 130, 210, 0.28) 0%, transparent 60%),
                linear-gradient(145deg, rgba(38, 56, 86, 0.78) 0%, rgba(22, 33, 52, 0.88) 100%);
        }

        .card-aprem {
            background:
                radial-gradient(circle at 82% 55%, rgba(245, 135, 35, 0.48) 0%, rgba(205, 85, 20, 0.22) 48%, transparent 75%),
                linear-gradient(145deg, rgba(52, 54, 72, 0.78) 0%, rgba(30, 32, 46, 0.88) 100%);
        }

        .card-manuelle {
            background:
                radial-gradient(circle at 55% 95%, rgba(20, 175, 165, 0.28) 0%, transparent 62%),
                radial-gradient(circle at 15% 30%, rgba(56, 152, 255, 0.2) 0%, transparent 55%),
                linear-gradient(145deg, rgba(32, 52, 76, 0.8) 0%, rgba(20, 32, 48, 0.9) 100%);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: clamp(11.5px, 3.3vw, 13.5px);
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
            white-space: nowrap;
            min-width: 0;
        }

        .card-full .card-title-row {
            font-size: 16px;
            gap: 9px;
        }

        .card-temp {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .card-full .card-temp {
            font-size: 15px;
        }

        .card-setting-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px 0 10px 0;
        }

        .card-setting {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1.2px;
            color: var(--text-primary);
            text-align: center;
            line-height: 1;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .card-full .card-setting {
            font-size: 54px;
            letter-spacing: -1.5px;
        }

        .card-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            min-height: 24px;
        }

        .water-temp {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .card-full .water-temp {
            font-size: 15px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(180deg, #34c759 0%, #249f43 100%);
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            box-shadow: 0 3px 10px rgba(46, 184, 92, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .card-full .badge {
            padding: 5px 12px;
            font-size: 12px;
        }

        .badge.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

            color: #ff6961;
            font-size
