<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chaudière</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#090e1a">
    <meta name="apple-mobile-web-app-title" content="Chaudière">
    <link rel="apple-touch-icon" sizes="180x180" href="chaudiere.png?v=1">
    <style>
        :root {
            --bg-dark: #090e1a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.78);
            --text-muted: rgba(255, 255, 255, 0.42);
            --accent-blue: #3898ff;
            --accent-green: #2eb85c;
            --accent-red: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: #090e1a;
            background: #090e1a;
            min-height: 100%;
        }

        body {
            color: var(--text-primary);
            min-height: 100vh;
            display: block;
            padding-top: max(calc(env(safe-area-inset-top, 0px) + 16px), 54px);
            padding-bottom: max(calc(env(safe-area-inset-bottom, 0px) + 20px), 30px);
            padding-left: 14px;
            padding-right: 14px;
            overflow-y: auto;
        }

        /* Indicateur Tirer pour actualiser */
        .ptr-indicator {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            height: 0;
            opacity: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            transition: height 0.25s ease, opacity 0.25s ease;
        }

        .ptr-indicator.pulling {
            transition: none;
        }

        .ptr-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .ptr-indicator.refreshing .ptr-icon {
            animation: ptr-spin 0.8s linear infinite;
        }

        @keyframes ptr-spin {
            to { transform: rotate(360deg); }
        }

        .app-grid {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            border-radius: 20px;
            padding: 13px 13px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
            min-height: 164px;
        }

        .card-full {
            grid-column: 1 / -1;
            min-height: auto;
            padding: 16px 18px;
        }

        .card-matin {
            background:
                radial-gradient(circle at 82% 85%, rgba(46, 204, 113, 0.25) 0%, transparent 55%),
                radial-gradient(circle at 15% 20%, rgba(65, 130, 210, 0.28) 0%, transparent 60%),
                linear-gradient(145deg, rgba(38, 56, 86, 0.78) 0%, rgba(22, 33, 52, 0.88) 100%);
        }

        .card-aprem {
            background:
                radial-gradient(circle at 82% 55%, rgba(245, 135, 35, 0.48) 0%, rgba(205, 85, 20, 0.22) 48%, transparent 75%),
                linear-gradient(145deg, rgba(52, 54, 72, 0.78) 0%, rgba(30, 32, 46, 0.88) 100%);
        }

        .card-manuelle {
            background:
                radial-gradient(circle at 55% 95%, rgba(20, 175, 165, 0.28) 0%, transparent 62%),
                radial-gradient(circle at 15% 30%, rgba(56, 152, 255, 0.2) 0%, transparent 55%),
                linear-gradient(145deg, rgba(32, 52, 76, 0.8) 0%, rgba(20, 32, 48, 0.9) 100%);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: clamp(11.5px, 3.3vw, 13.5px);
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
            white-space: nowrap;
            min-width: 0;
        }

        .card-title-row svg {
            flex-shrink: 0;
        }

        .card-full .card-title-row {
            font-size: 16px;
            gap: 9px;
        }

        .card-temp {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .card-full .card-temp {
            font-size: 15px;
        }

        .card-setting-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 14px 0 10px 0;
        }

        .card-setting {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1.2px;
            color: var(--text-primary);
            text-align: center;
            line-height: 1;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .card-full .card-setting {
            font-size: 54px;
            letter-spacing: -1.5px;
        }

        .card-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            min-height: 24px;
        }

        .water-temp {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .card-full .water-temp {
            font-size: 15px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(180deg, #34c759 0%, #249f43 100%);
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            box-shadow: 0 3px 10px rgba(46, 184, 92, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .card-full .badge {
            padding: 5px 12px;
            font-size: 12px;
        }

        .badge.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .card.cutoff .card-setting {
            color: #ff6961;
            font-size: 28px;
            letter-spacing: -0.4px;
        }

        .card-full.cutoff .card-setting {
            font-size: 40px;
        }

        .manual-control {
            margin: 14px 0 4px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-wrapper {
            position: relative;
            height: 34px;
            display: flex;
            align-items: center;
        }

        .custom-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #3898ff 0%, #3898ff 60%, rgba(255, 255, 255, 0.16) 60%, rgba(255, 255, 255, 0.16) 100%);
            outline: none;
            position: relative;
            z-index: 2;
            cursor: pointer;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .custom-slider::-webkit-slider-thumb:active {
            transform: scale(1.12);
        }

        .custom-slider::-moz-range-thumb {
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        .slider-ticks {
            position: absolute;
            top: 50%;
            left: 11px;
            right: 11px;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            z-index: 1;
            pointer-events: none;
        }

        .tick {
            width: 1.5px;
            height: 14px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 1px;
        }

        .tick.major {
            height: 18px;
            width: 2px;
            background: rgba(255, 255, 255, 0.35);
        }

        .tick.active-tick {
            background: rgba(56, 152, 255, 0.75);
        }

        .ticks-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            padding: 0 2px;
        }

        .error-message {
            grid-column: 1 / -1;
            color: var(--accent-red);
            font-size: 13px;
            text-align: center;
            padding: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Indicateur glisser vers le bas pour actualiser -->
    <div class="ptr-indicator" id="ptr-indicator">
        <div class="ptr-icon" id="ptr-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#3898ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
                <polyline points="21 3 21 9 15 9"/>
            </svg>
        </div>
        <span id="ptr-text">Tirer pour actualiser</span>
    </div>

    <div class="app-grid">
        <!-- 1. HAUT GAUCHE : AUJOURD'HUI AM -->
        <div class="card card-matin" id="card-today-matin">
            <div class="card-header">
                <div class="card-title-row">
                    <!-- ICÔNE SOLEIL LEVANT (AM) -->
                    <svg class="icon-sunrise" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ffbe0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 6v2.5"/>
                        <path d="M4.5 9.5l1.8 1.8"/>
                        <path d="M19.5 9.5l-1.8 1.8"/>
                        <path d="M7 17a5 5 0 0 1 10 0Z" fill="#ffbe0b"/>
                        <path d="M2 17h20"/>
                    </svg>
                    <span id="label-today-matin">... AM</span>
                </div>
                <div class="card-temp" id="temp-today-matin">--°C</div>
            </div>
            <div class="card-setting-container">
                <div class="card-setting" id="setting-today-matin">--</div>
            </div>
            <div class="card-footer">
                <span class="water-temp" id="water-today-matin">Eau --°C</span>
                <span class="badge hidden" id="badge-today-matin">Plage Optimale</span>
            </div>
        </div>

        <!-- 2. HAUT DROIT : AUJOURD'HUI PM -->
        <div class="card card-aprem" id="card-today-aprem">
            <div class="card-header">
                <div class="card-title-row">
                    <!-- ICÔNE SOLEIL PLEIN (PM) -->
                    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="#ffbe0b" stroke="#ffbe0b" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                    <span id="label-today-aprem">... PM</span>
                </div>
                <div class="card-temp" id="temp-today-aprem">--°C</div>
            </div>
            <div class="card-setting-container">
                <div class="card-setting" id="setting-today-aprem">--</div>
            </div>
            <div class="card-footer">
                <span class="water-temp" id="water-today-aprem">Eau --°C</span>
                <span class="badge hidden" id="badge-today-aprem">Plage Optimale</span>
            </div>
        </div>

        <!-- 3. MILIEU GAUCHE : DEMAIN AM -->
        <div class="card card-matin" id="card-tomorrow-matin">
            <div class="card-header">
                <div class="card-title-row">
                    <!-- ICÔNE SOLEIL LEVANT (AM) -->
                    <svg class="icon-sunrise" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ffbe0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 6v2.5"/>
                        <path d="M4.5 9.5l1.8 1.8"/>
                        <path d="M19.5 9.5l-1.8 1.8"/>
                        <path d="M7 17a5 5 0 0 1 10 0Z" fill="#ffbe0b"/>
                        <path d="M2 17h20"/>
                    </svg>
                    <span id="label-tomorrow-matin">... AM</span>
                </div>
                <div class="card-temp" id="temp-tomorrow-matin">--°C</div>
            </div>
            <div class="card-setting-container">
                <div class="card-setting" id="setting-tomorrow-matin">--</div>
            </div>
            <div class="card-footer">
                <span class="water-temp" id="water-tomorrow-matin">Eau --°C</span>
                <span class="badge hidden" id="badge-tomorrow-matin">Plage Optimale</span>
            </div>
        </div>

        <!-- 4. MILIEU DROIT : DEMAIN PM -->
        <div class="card card-aprem" id="card-tomorrow-aprem">
            <div class="card-header">
                <div class="card-title-row">
                    <!-- ICÔNE SOLEIL PLEIN (PM) -->
                    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="#ffbe0b" stroke="#ffbe0b" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                    </svg>
                    <span id="label-tomorrow-aprem">... PM</span>
                </div>
                <div class="card-temp" id="temp-tomorrow-aprem">--°C</div>
            </div>
            <div class="card-setting-container">
                <div class="card-setting" id="setting-tomorrow-aprem">--</div>
            </div>
            <div class="card-footer">
                <span class="water-temp" id="water-tomorrow-aprem">Eau --°C</span>
                <span class="badge hidden" id="badge-tomorrow-aprem">Plage Optimale</span>
            </div>
        </div>

        <!-- 5. BAS (PLEINE LARGEUR) : MANUEL -->
        <div class="card card-full card-manuelle" id="card-manuelle">
            <div class="card-header">
                <div class="card-title-row">
                    <!-- ICÔNE MANUEL -->
                    <svg class="icon-manual" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#8ecae6" stroke-width="2" stroke-linecap="round">
                        <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
                        <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
                        <line x1="1" y1="14" x2="7" y2="14"/>
                        <line x1="9" y1="8" x2="15" y2="8"/>
                        <line x1="17" y1="16" x2="23" y2="16"/>
                    </svg>
                    <span>Manuel</span>
                </div>
                <div class="card-temp" id="temp-manuelle">--°C</div>
            </div>

            <div class="manual-control">
                <div class="slider-wrapper">
                    <input type="range" id="manual-slider" class="custom-slider" min="-5" max="20" step="1" value="10">
                    <div class="slider-ticks" id="slider-ticks"></div>
                </div>
                <div class="ticks-labels">
                    <span>-5°C</span>
                    <span>0°C</span>
                    <span>5°C</span>
                    <span>10°C</span>
                    <span>15°C</span>
                    <span>20°C</span>
                </div>
            </div>

            <div class="card-setting-container" style="padding-top: 10px;">
                <div class="card-setting" id="setting-manuelle">--</div>
            </div>
            <div class="card-footer">
                <span class="water-temp" id="water-manuelle">Eau --°C</span>
                <span class="badge hidden" id="badge-manuelle">Plage Optimale</span>
            </div>
        </div>

        <div class="error-message" id="error-msg">Erreur de chargement de la météo.</div>
    </div>

    <script>
        (function () {
            const LATITUDE = 48.857;
            const LONGITUDE = 2.019;
            const JOURS = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
            let weatherData = null;
            let userTouchedSlider = false;

            const manualSlider = document.getElementById('manual-slider');

            function customRound(val) {
                return Math.floor(val + 0.5);
            }

            function getWeekdayName(offsetDays) {
                const d = new Date();
                d.setDate(d.getDate() + offsetDays);
                return JOURS[d.getDay()];
            }

            function formatDateISO(offsetDays) {
                const d = new Date();
                d.setDate(d.getDate() + offsetDays);
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            function resolveReglage(temp) {
                if (temp >= 19) return { reglage: "Coupé", eau: "off", optimal: false };
                if (temp >= 16 && temp <= 18) return { reglage: "0,75", eau: "44°C", optimal: false };
                if (temp >= 13 && temp <= 15) return { reglage: "1", eau: "45°C", optimal: false };
                if (temp >= 10 && temp <= 12) return { reglage: "1,25", eau: "45,8°C", optimal: false };
                if (temp === 9) return { reglage: "1,5", eau: "46,5°C", optimal: false };
                if (temp === 8) return { reglage: "1,75", eau: "47,3°C", optimal: false };
                if (temp === 7) return { reglage: "2", eau: "48°C", optimal: true };
                if (temp === 6) return { reglage: "2,25", eau: "50°C", optimal: true };
                if (temp === 5) return { reglage: "2,5", eau: "52°C", optimal: true };
                if (temp >= 3 && temp <= 4) return { reglage: "2,75", eau: "54°C", optimal: false };
                if (temp === 2) return { reglage: "3", eau: "56°C", optimal: false };
                if (temp === 1) return { reglage: "3,25", eau: "58°C", optimal: false };
                if (temp === 0) return { reglage: "3,5", eau: "60°C", optimal: false };
                if (temp >= -2 && temp <= -1) return { reglage: "3,75", eau: "62°C", optimal: false };
                if (temp <= -3) return { reglage: "4", eau: "64°C", optimal: false };
                return { reglage: "--", eau: "--°C", optimal: false };
            }

            function setDayLabels() {
                const todayLabel = getWeekdayName(0);
                const tomorrowLabel = getWeekdayName(1);
                document.getElementById('label-today-matin').textContent = `${todayLabel} AM`;
                document.getElementById('label-today-aprem').textContent = `${todayLabel} PM`;
                document.getElementById('label-tomorrow-matin').textContent = `${tomorrowLabel} AM`;
                document.getElementById('label-tomorrow-aprem').textContent = `${tomorrowLabel} PM`;
            }

            function generateSliderTicks() {
                const container = document.getElementById('slider-ticks');
                container.innerHTML = '';
                for (let i = -5; i <= 20; i++) {
                    const tick = document.createElement('div');
                    tick.className = (i % 5 === 0) ? 'tick major' : 'tick';
                    tick.id = `tick-${i}`;
                    container.appendChild(tick);
                }
            }

            function updateSliderVisuals(val) {
                const min = -5;
                const max = 20;
                const percentage = ((val - min) / (max - min)) * 100;
                manualSlider.style.background = `linear-gradient(to right, #3898ff 0%, #3898ff ${percentage}%, rgba(255, 255, 255, 0.16) ${percentage}%, rgba(255, 255, 255, 0.16) 100%)`;

                for (let i = min; i <= max; i++) {
                    const tick = document.getElementById(`tick-${i}`);
                    if (tick) tick.classList.toggle('active-tick', i <= val);
                }
            }

            function updateManual(val) {
                updateSliderVisuals(val);
                document.getElementById('temp-manuelle').textContent = `${val}°C`;

                const result = resolveReglage(val);
                const settingEl = document.getElementById('setting-manuelle');
                const waterEl = document.getElementById('water-manuelle');
                const badgeEl = document.getElementById('badge-manuelle');
                const cardEl = document.getElementById('card-manuelle');

                settingEl.textContent = result.reglage;

                if (result.reglage === "Coupé") {
                    cardEl.classList.add('cutoff');
                    waterEl.textContent = "Chauffage coupé";
                } else {
                    cardEl.classList.remove('cutoff');
                    waterEl.textContent = `Eau ${result.eau}`;
                }

                badgeEl.classList.toggle('hidden', !result.optimal);
            }

            function computePeriodAverage(dateISO, startHour, endHour) {
                if (!weatherData) return null;
                const temps = [];
                for (let i = 0; i < weatherData.time.length; i++) {
                    if (weatherData.time[i].startsWith(dateISO)) {
                        const hour = parseInt(weatherData.time[i].substring(11, 13), 10);
                        if (hour >= startHour && hour <= endHour) {
                            temps.push(weatherData.temperature_2m[i]);
                        }
                    }
                }
                return temps.length ? temps.reduce((a, b) => a + b, 0) / temps.length : null;
            }

            function updateWeatherCard(id, exactTemp) {
                const tempEl = document.getElementById(`temp-${id}`);
                const settingEl = document.getElementById(`setting-${id}`);
                const waterEl = document.getElementById(`water-${id}`);
                const badgeEl = document.getElementById(`badge-${id}`);
                const cardEl = document.getElementById(`card-${id}`);

                if (exactTemp === null || exactTemp === undefined) {
                    tempEl.textContent = "--°C";
                    settingEl.textContent = "--";
                    waterEl.textContent = "Eau --°C";
                    badgeEl.classList.add('hidden');
                    cardEl.classList.remove('cutoff');
                    return;
                }

                const roundedTemp = customRound(exactTemp);
                tempEl.textContent = `${roundedTemp}°C`;

                const result = resolveReglage(roundedTemp);
                settingEl.textContent = result.reglage;

                if (result.reglage === "Coupé") {
                    cardEl.classList.add('cutoff');
                    waterEl.textContent = "Chauffage coupé";
                } else {
                    cardEl.classList.remove('cutoff');
                    waterEl.textContent = `Eau ${result.eau}`;
                }

                badgeEl.classList.toggle('hidden', !result.optimal);
            }

            async function fetchWeather() {
                const errEl = document.getElementById('error-msg');
                errEl.style.display = 'none';
                try {
                    const response = await fetch(
                        `https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current=temperature_2m&hourly=temperature_2m&timezone=Europe/Paris&forecast_days=3`,
                        { cache: 'no-store' }
                    );
                    if (!response.ok) throw new Error("Erreur réseau");
                    const data = await response.json();
                    weatherData = data.hourly;

                    const todayISO = formatDateISO(0);
                    const tomorrowISO = formatDateISO(1);

                    updateWeatherCard('today-matin', computePeriodAverage(todayISO, 6, 9));
                    updateWeatherCard('today-aprem', computePeriodAverage(todayISO, 10, 20));
                    updateWeatherCard('tomorrow-matin', computePeriodAverage(tomorrowISO, 6, 9));
                    updateWeatherCard('tomorrow-aprem', computePeriodAverage(tomorrowISO, 10, 20));

                    // Réglage par défaut de la partie Manuel sur la température actuelle
                    if (!userTouchedSlider && data.current && typeof data.current.temperature_2m === 'number') {
                        const roundedCurrent = customRound(data.current.temperature_2m);
                        const clampedCurrent = Math.max(-5, Math.min(20, roundedCurrent));
                        manualSlider.value = clampedCurrent;
                        updateManual(clampedCurrent);
                    }
                } catch (err) {
                    errEl.style.display = 'block';
                    if (!userTouchedSlider) {
                        updateManual(parseInt(manualSlider.value, 10));
                    }
                }
            }

            // =====================================================
            // GLISSER VERS LE BAS POUR TOUT ACTUALISER (PULL-TO-REFRESH)
            // =====================================================
            const ptrIndicator = document.getElementById('ptr-indicator');
            const ptrIcon = document.getElementById('ptr-icon');
            const ptrText = document.getElementById('ptr-text');
            const PULL_THRESHOLD = 58;

            let startY = 0;
            let pullDistance = 0;
            let isPulling = false;
            let isRefreshing = false;
            let thresholdReached = false;

            window.addEventListener('touchstart', (e) => {
                if (isRefreshing || e.touches.length !== 1) return;
                if (e.target && e.target.closest('input')) return;
                if (window.scrollY <= 0) {
                    startY = e.touches[0].clientY;
                    pullDistance = 0;
                    isPulling = true;
                    thresholdReached = false;
                    ptrIndicator.classList.add('pulling');
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!isPulling || isRefreshing) return;
                const diff = e.touches[0].clientY - startY;

                if (diff > 0 && window.scrollY <= 0) {
                    e.preventDefault();
                    pullDistance = Math.min(diff * 0.48, 82);
                    ptrIndicator.style.height = `${pullDistance}px`;
                    ptrIndicator.style.opacity = Math.min(pullDistance / 48, 1);
                    ptrIcon.style.transform = `rotate(${Math.round(pullDistance * 3.2)}deg)`;

                    if (pullDistance >= PULL_THRESHOLD) {
                        ptrText.textContent = 'Relâcher pour actualiser';
                        if (!thresholdReached) {
                            thresholdReached = true;
                            if (navigator.vibrate) navigator.vibrate(10);
                        }
                    } else {
                        ptrText.textContent = 'Tirer pour actualiser';
                        thresholdReached = false;
                    }
                } else if (diff < 0) {
                    isPulling = false;
                    ptrIndicator.classList.remove('pulling');
                    ptrIndicator.style.height = '0px';
                    ptrIndicator.style.opacity = '0';
                }
            }, { passive: false });

            function finishPull() {
                if (!isPulling) return;
                isPulling = false;
                ptrIndicator.classList.remove('pulling');

                if (pullDistance >= PULL_THRESHOLD) {
                    isRefreshing = true;
                    ptrIndicator.classList.add('refreshing');
                    ptrIndicator.style.height = '44px';
                    ptrIndicator.style.opacity = '1';
                    ptrIcon.style.transform = '';
                    ptrText.textContent = 'Actualisation...';
                    setTimeout(() => {
                        window.location.reload();
                    }, 300);
                } else {
                    ptrIndicator.style.height = '0px';
                    ptrIndicator.style.opacity = '0';
                }
                pullDistance = 0;
            }

            window.addEventListener('touchend', finishPull, { passive: true });
            window.addEventListener('touchcancel', finishPull, { passive: true });

            // Initialisation immédiate
            setDayLabels();
            generateSliderTicks();
            updateSliderVisuals(parseInt(manualSlider.value, 10));

            manualSlider.addEventListener('input', (e) => {
                userTouchedSlider = true;
                updateManual(parseInt(e.target.value, 10));
                if (navigator.vibrate) navigator.vibrate(5);
            });

            fetchWeather();
        })();
    </script>
</body>
</html>
